[package]
name = "rest_libcint"
version = "0.1.1"
authors = ["Igor Ying Zhang <igor_zhangying@fudan.edu.cn>"]
edition = "2021"
description = "Provide wrappers for libcint (C)"
license = "MIT OR Apache-2.0"

[dependencies]
itertools = { version = "0.14" }
rayon = { version = "1.10" }
num = { version = "0.4", features = ["std"] }
libm = { version = "0.2" }
duplicate = { version = "2.0"}
derive_builder = { version = "0.20"}
rstsr-common = { version = "0.6", features = ["rayon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

[build-dependencies]
cmake = { version = "0.1" }
cc = { version = "1.0" }

[features]
with_f12 = []
with_4c1e = []
build_from_source = []
static = []
qcint = []

[dev-dependencies]
rstest = "0.25"
ndarray = "0.15"
approx = "0.5"

[profile.dev]
opt-level = 3

[lib]
doctest = false
